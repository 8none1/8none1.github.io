name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - rebuild   # build-only validation on the rebuild branch (deploy is gated to master below)
  workflow_dispatch:

# Allow one concurrent deployment; don't cancel an in-progress run (so an
# ognflights publish that lands mid-deploy still completes cleanly).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Only ever deploy from master. Pushes to other branches (e.g. rebuild) run
    # the build job for validation but never publish.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
